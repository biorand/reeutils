name: CI
on: [push, pull_request]
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # request the GitHub OIDC token used for NuGet trusted publishing
    steps:
    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: true
    - name: Restore
      run: dotnet restore
    - name: Pack NuGet packages
      run: |
        dotnet pack src/IntelOrca.Biohazard.REE -c Release -o .
        dotnet pack src/reeutils -c Release -o .
    - name: Build reeutils
      run: |
        dotnet publish src/reeutils -c Release -o out/reeutils --os linux
        dotnet publish src/reeutils -c Release -o out/reeutils --os win
    - name: Run tests
      id: run_tests
      continue-on-error: true
      run: |
        dotnet test -c Release --logger "trx;LogFileName=test-results.trx" --logger "console;verbosity=detailed" --collect:"XPlat Code Coverage"
    - name: Pack reeutils
      run: |
        cd out/reeutils
        rm -rf *.deps.json *.pdb de fr sv
        cp ../../script/* .
        cd ..
        tar czf ../reeutils.tar.gz .
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: reeutils
        path: |
          *.nupkg
          out/**/*
    - name: Create release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/v')
      with:
        fail_on_unmatched_files: true
        files: |
          *.nupkg
          reeutils.tar.gz
    - name: NuGet login
      if: startsWith(github.ref, 'refs/tags/v')
      id: nuget-login
      uses: NuGet/login@v1
      with:
        user: IntelOrca
    - name: Publish to nuget.org
      if: startsWith(github.ref, 'refs/tags/v')
      run: dotnet nuget push *.nupkg --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
